[tool.poetry]
name = "vertex-ai-chatbot"
version = "0.1.0"
description = "A Streamlit chatbot app connected to Google Vertex AI"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
streamlit = "^1.47.0"
google-genai = "^1.27.0"
python-dotenv = "^1.0.0"
haystack-ai = "^2.10.0"
chromadb = "^1.0.17"
chroma-haystack = "^3.3.0"
langgraph = "^0.2.60"
langchain = "^0.3.12"
langchain-google-genai = "^2.1.9"
pydantic = "^2.0.0"
sentence-transformers = "^3.3.1"
pypdf = "^5.1.0"
python-docx = "^1.1.2"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.3"
nltk = "^3.9.1"
numpy = "^2.0.0"
torch = "^2.0.0"
tokenizers = "0.21.2"
nest-asyncio = "^1.6.0"
pydantic-settings = "^2.10.1"


[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
ruff = "^0.9.7"
pre-commit = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "streamlit run app.py"
